services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: claude-db-testbed-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - mssql-data:/var/opt/mssql

  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: claude-db-testbed-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./init:/init:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      '
      if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
        EXTRA="-C";
      else
        SQLCMD=/opt/mssql-tools/bin/sqlcmd;
        EXTRA="";
      fi;
      for i in {1..30}; do
        $$SQLCMD -S mssql -U sa -P "YourStrong!Passw0rd" $$EXTRA -Q "SELECT 1" && break;
        sleep 2;
      done;
      $$SQLCMD -S mssql -U sa -P "YourStrong!Passw0rd" $$EXTRA -i /init/001-schema.sql;
      $$SQLCMD -S mssql -U sa -P "YourStrong!Passw0rd" $$EXTRA -i /init/002-seed-data.sql;
      $$SQLCMD -S mssql -U sa -P "YourStrong!Passw0rd" $$EXTRA -i /init/003-readonly-user.sql;
      echo "Database testbed initialized.";
      '
    restart: "no"

volumes:
  mssql-data:
